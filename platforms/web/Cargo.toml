[package]
name = "accesskit_web"
version = "0.1.0"
authors.workspace = true
license.workspace = true
description = "AccessKit UI accessibility infrastructure: Web adapter"
categories.workspace = true
keywords = ["gui", "ui", "accessibility"]
repository.workspace = true
readme = "README.md"
edition.workspace = true
rust-version.workspace = true

[dependencies]
log = "0.4"
accesskit = { path = "../../common" }
accesskit_consumer = { path = "../../consumer" }
wasm-bindgen = "0.2.92"

[dependencies.web-sys]
version = "0.3.69"
features = [
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Window",
    "CssStyleDeclaration",
    "InputEvent",
    "KeyboardEvent",
    "ClipboardEvent",
    "DataTransfer",
    "Event",
    "EventTarget",
]
