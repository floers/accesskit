[package]
name = "slint-web"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/server.rs"
required-features = ["server"]

[features]
default = []
server = ["tower", "tower-http", "axum", "tokio", "thirtyfour"]

[dependencies]
log = "0.4"
wasm-logger = "0.2"
anyhow = "1"
console_error_panic_hook = "0.1"
wasm-bindgen = { version = "0.2.100", optional = false }
# slint = { version = "1.9", optional = false }
slint = { git = "https://github.com/floers/slint.git", branch = "web-accessibility", features = [
    "accessibility",
] }
# slint = { path = "../../../slint/api/rs/slint", features = [
#     "accessibility",
# ] }

tower = { version = "0.5.2", optional = true }
tower-http = { version = "0.6.2", features = ["fs"], optional = true }
axum = { version = "0.8.1", optional = true }
tokio = { version = "1.43.0", features = ["full"], optional = true }
thirtyfour = { version = "0.35.0", optional = true }

[build-dependencies]
# slint-build = { version = "1.9", optional = false }
slint-build = { git = "https://github.com/floers/slint.git", branch = "web-accessibility" }
# slint-build = { path = "../../../slint/api/rs/build" }

[package.metadata.wasm-pack.profile.release]
wasm-opt = false